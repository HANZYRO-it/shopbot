services:
  bot:
    build: .
    container_name: shopbot
    restart: unless-stopped        # сам поднимется после сбоя и после перезагрузки сервера
    env_file: .env                 # BOT_TOKEN, ADMIN_IDS, DATABASE_URL и остальное
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
